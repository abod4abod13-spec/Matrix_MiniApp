<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adsgram Test</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 350px;
    }
    .btn {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: white;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    #status { margin-top: 15px; font-size: 13px; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚀 اختبار Adsgram المباشر</h2>
    <p style="color:#94a3b8; font-size:12px;">البلوك: <b>44130</b></p>

    <!-- زر مع وضع التجربة المضمون -->
    <button class="btn" onclick="showAd(true)">تجربة العرض (Test Mode) 🧪</button>
    
    <!-- زر الإعلانات الحقيقية -->
    <button class="btn" style="background:#22c55e;" onclick="showAd(false)">طلب إعلان حقيقي 💎</button>

    <div id="status">جاهز للاختبار</div>
  </div>

  <script>
    window.Telegram.WebApp.ready();

    function showAd(isTest) {
      const status = document.getElementById('status');
      status.innerText = "جاري طلب الإعلان...";

      if (typeof window.Adsgram === 'undefined') {
        status.innerText = "❌ افتح الصفحة من داخل التلغرام";
        return;
      }

      // إرسال debug: true لإجبار المنصة على إرجاع إعلان فحص تجريبي
      const adController = window.Adsgram.init({ 
        blockId: "44130",
        debug: isTest 
      });

      adController.show().then((result) => {
        status.innerText = "🎉 تم مشاهدة الإعلان بنجاح واستلام المكافأة!";
        alert("🎉 مبروك! نجحت العملية وحصلت على المكافأة.");
      }).catch((error) => {
        console.log("Adsgram Error:", error);
        status.innerText = "⚠️ لم يتوفر إعلان حقيقي حالياً (No Fill) أو تم الإغلاق.";
      });
    }
  </script>
</body>
</html>
