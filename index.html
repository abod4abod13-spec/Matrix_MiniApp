<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigaPub Ad Test</title>
  
  <!-- 1. سكريبت تلغرام الرسمي -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- 2. سكريبت GigaPub بالـ ID الخاص بك (7848) -->
  <script src="https://ad.gigapub.tech/script?id=7848"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 350px;
    }
    .btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    #status {
      margin-top: 15px;
      font-size: 13px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ إعلانات GigaPub</h2>
    <p style="color: #94a3b8; font-size: 12px;">مُعرف القناة: 7848</p>
    
    <button class="btn" onclick="watchGigaAd()">مشاهدة الإعلان والمكافأة 💎</button>
    <div id="status">اضغط لعرض الإعلان مباشرة</div>
  </div>

  <script>
    window.Telegram.WebApp.ready();

    function watchGigaAd() {
      const status = document.getElementById('status');
      status.innerText = "جاري تحميل إعلان GigaPub...";

      if (typeof window.showGiga !== 'function') {
        status.innerText = "❌ لم يتم تحميل سكريبت GigaPub بنجاح";
        return;
      }

      // استدعاء دالة العرض الخاصة بـ GigaPub
      window.showGiga()
        .then(() => {
          // كود منح المكافأة للمستخدم عند اكتمال الإعلان
          status.innerText = "🎉 تم مشاهدة الإعلان بنجاح وحساب المكافأة!";
          alert("🎉 مبروك! حصلت على المكافأة.");
        })
        .catch((e) => {
          // التعامل مع الأخطاء أو إلغاء العرض
          console.error("GigaPub Error:", e);
          status.innerText = "⚠️ تعذر عرض الإعلان أو تم إغلاقه.";
        });
    }
  </script>
</body>
</html>
