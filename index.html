<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adsgram Test</title>
  
  <!-- 1. استدعاء سكريبت تلغرام الرسمي -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- 2. استدعاء مكتبة Adsgram الرسمية -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h2>💎 تجربة إعلانات Adsgram</h2>
  <button class="btn" onclick="showTestAd()">مشاهدة إعلان تجريبي 🚀</button>
  <div id="status">اضغط على الزر لعرض الإعلان</div>

  <script>
    // تهيئة تطبيق التلغرام
    window.Telegram.WebApp.ready();

    function showTestAd() {
      const status = document.getElementById('status');
      status.innerText = "جاري تحميل الإعلان...";

      if (typeof window.Adsgram === 'undefined') {
        status.innerText = "❌ افتح الصفحة داخل تطبيق تلغرام!";
        return;
      }

      // المعرف التجريبي الرسمي المعتمد من Adsgram لاختبار الإعلانات
      const adController = window.Adsgram.init({ blockId: "check-block-id" });

      adController.show().then((result) => {
        status.innerText = "🎉 تم عرض الإعلان التجريبي بنجاح واستلام المكافأة!";
      }).catch((error) => {
        status.innerText = "⚠️ تم إغلاق الإعلان أو حدث خطأ: " + JSON.stringify(error);
      });
    }
  </script>
</body>
</html>
